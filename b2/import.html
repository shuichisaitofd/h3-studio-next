<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>β2 に案件を入れる</title>
<style>body{font:18px/1.7 -apple-system,sans-serif;margin:0;padding:16px;background:#111;color:#eee}#r{background:#14351f;border-radius:12px;padding:14px}#r.ng{background:#4a1d1d}a.b{display:block;text-align:center;background:#2f6bff;color:#fff;border-radius:12px;padding:16px;margin-top:14px;text-decoration:none;font-size:18px}small{color:#aaa}</style></head><body>
<div id="r">処理中…</div><div id="go"></div><p><small id="d"></small></p>
<script>
(function(){var L=localStorage,r=document.getElementById('r'),go=document.getElementById('go'),d=document.getElementById('d');
function arr(v){try{var a=JSON.parse(v);return Array.isArray(a)?a:null}catch(e){return null}}
try{
var src=null,srcA=null;
['studio.',''].forEach(function(p){if(src!==null)return;var a=arr(L.getItem(p+'h3MobileProjects'));if(a&&a.length&&!a.every(function(x){return ['案件A','案件B','案件C'].indexOf(x.name)>=0&&!x.prompt})){src=p;srcA=a}});
if(src===null){r.className='ng';r.innerHTML='コピー元の案件が見つかりませんでした。';}
else{
['h3MobileProjects','h3MobileActiveProjectId','h3MobileProjectFavOnly'].forEach(function(k){var v=L.getItem(src+k);if(v!==null)L.setItem('studioB2.'+k,v)});
L.setItem('studioB2.migrated2','auto:'+src);
var back=arr(L.getItem('studioB2.h3MobileProjects'));
if(back&&back.length===srcA.length){r.innerHTML='✅ コピーしました。<br>β2 の案件：'+back.length+' 件<br><small>'+back.slice(0,10).map(function(p){return p.name}).join(' / ')+'</small>';go.innerHTML='<a class="b" href="./?r='+Date.now()+'">β2 を開く</a>'}
else{r.className='ng';r.innerHTML='⚠️ コピーに失敗しました。'}}
}catch(e){r.className='ng';r.innerHTML='⚠️ エラー: '+e}
d.innerHTML='元: '+(src===null?'なし':(src||'(prefix なし)')+'h3MobileProjects');
})();
</script></body></html>
